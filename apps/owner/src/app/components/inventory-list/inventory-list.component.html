<div class="flex flex-col gap-4">
  <!-- Empty state -->
  <div
    *ngIf="tools.length === 0"
    class="glass-card p-8 text-center text-white/50"
  >
    You have not listed any tools yet. Click "Add Tool" to get started.
  </div>

  <!-- Tools -->
  <div
    *ngFor="let item of tools"
    class="glass-card p-5 relative overflow-hidden group"
  >
    <div class="flex gap-4">
      <!-- Details -->
      <div class="flex-1">
        <div class="flex justify-between items-start mb-1">
          <!-- TITLE -->
          <h3 class="font-bold text-white text-lg leading-tight">
            {{ item.title }}
          </h3>

          <!-- Toggle -->
          <button
            (click)="toggleStatus(item)"
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none"
            [class.bg-emerald-trust]="item.is_active"
            [class.bg-slate-700]="!item.is_active"
          >
            <span
              class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
              [class.translate-x-6]="item.is_active"
              [class.translate-x-1]="!item.is_active"
            ></span>
          </button>
        </div>

        <!-- PRICE -->
        <div class="text-sm font-medium tabular-nums text-emerald-400 mb-3">
          ₹{{ item.price_per_day }} / day
        </div>

        <!-- CATEGORY -->
        <div class="text-sm text-white/60 mb-2">
          {{ item.category }}
        </div>

        <!-- DESCRIPTION -->
        <div class="text-sm text-white/50 mb-3">
          {{ item.description }}
        </div>

        <!-- ADDRESS -->
        <div class="text-sm text-white/50">📍 {{ item.address }}</div>

        <!-- Actions -->
        <div class="flex gap-3 text-xs mt-4">
          <a
            [routerLink]="['tools', item.id, 'edit']"
            class="btn-primary py-1.5 px-4 rounded-xl inline-block"
          >
            Edit
          </a>

          <button
            (click)="deleteTool(item.id)"
            class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-4 py-1.5 rounded-xl font-semibold transition-colors"
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
