<div class="h-full grid grid-cols-1 lg:grid-cols-12 gap-6 pb-10">
  <!-- Left Column: Dispute Queue (3 cols) -->
  <div class="lg:col-span-3 flex flex-col gap-4 border-r border-white/5 pr-4">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xl font-bold text-white">Disputess</h2>
      <div
        class="w-6 h-6 rounded-full bg-amber-warning/20 text-amber-warning flex items-center justify-center text-xs font-bold"
      >
        1
      </div>
    </div>

    <div class="space-y-3 overflow-y-auto pr-2 pb-4">
      <app-dispute-card
        *ngFor="let dispute of disputes"
        [dispute]="dispute"
        [isSelected]="selectedDispute.id === dispute.id"
        (select)="selectDispute($event)"
      >
      </app-dispute-card>
    </div>
  </div>

  <!-- Right Column: Resolution Desk (9 cols) -->
  <div class="lg:col-span-9 flex flex-col gap-6" *ngIf="selectedDispute">
    <div class="flex justify-between items-start">
      <div>
        <h2 class="text-2xl font-bold text-white mb-1">
          Case #{{selectedDispute.id}}: {{selectedDispute.toolName}}
        </h2>
        <p class="text-sm text-white/50">Filed on {{selectedDispute.date}}</p>
      </div>
      <div class="text-right">
        <div class="text-sm font-bold text-emerald-400">
          Escrow Locked: ₹{{selectedDispute.escrowAmount}}
        </div>
      </div>
    </div>

    <!-- Reason -->
    <div
      class="bg-amber-warning/10 border border-amber-warning/20 rounded-2xl p-4 text-sm text-amber-100/90 flex gap-3"
    >
      <svg
        class="w-5 h-5 text-amber-warning shrink-0"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <div>
        <span class="font-bold block mb-1">Owner Claim:</span>
        {{selectedDispute.reason}}
      </div>
    </div>

    <app-photo-comparison class="flex-1"></app-photo-comparison>

    <app-resolution-panel
      *ngIf="selectedDispute.status === 'OPEN'"
    ></app-resolution-panel>
  </div>
</div>
