<div class="fixed bottom-4 right-4 w-96 bg-white rounded-lg shadow-xl overflow-hidden flex flex-col h-[500px] border border-gray-200">
  <!-- Header -->
  <div class="bg-indigo-600 text-white p-4 flex justify-between items-center">
    <div>
      <h3 class="font-semibold text-lg">Chat with Owner</h3>
      <p class="text-xs text-indigo-200" *ngIf="isTyping">Typing...</p>
    </div>
  </div>

  <!-- Messages -->
  <div class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col space-y-3">
    <div *ngIf="messages.length === 0" class="text-center text-gray-500 mt-10">
      No messages yet. Send a message to start!
    </div>
    <div *ngFor="let msg of messages" 
         [ngClass]="msg.sender_id === borrowerId ? 'self-end bg-indigo-500 text-white' : 'self-start bg-white border border-gray-200 text-gray-800'"
         class="max-w-[80%] rounded-2xl px-4 py-2 shadow-sm text-sm relative group">
      {{ msg.message }}
      <span class="text-[10px] opacity-70 block mt-1" [ngClass]="msg.sender_id === borrowerId ? 'text-right' : 'text-left'">
        {{ msg.created_at | date:'shortTime' }}
      </span>
    </div>
  </div>

  <!-- Input -->
  <div class="p-3 bg-white border-t border-gray-200 flex items-center">
    <input 
      type="text" 
      [(ngModel)]="newMessage" 
      (input)="onTyping()"
      (keyup.enter)="sendMessage()"
      placeholder="Type a message..." 
      class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
    />
    <button 
      (click)="sendMessage()" 
      class="ml-2 bg-indigo-600 text-white rounded-full p-2 hover:bg-indigo-700 transition"
      [disabled]="!newMessage.trim()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
      </svg>
    </button>
  </div>
</div>
